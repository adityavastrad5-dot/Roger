<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roger - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 500px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
    .screen { display: none; padding: 30px; min-height: 600px; }
    .screen.active { display: block; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { font-size: 24px; color: #333; }
    input { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 2px solid #e0e0e0; border-radius: 8px; }
    button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button:hover { background: #5568d3; }
    .link { color: #667eea; cursor: pointer; text-decoration: underline; font-size: 14px; }
    .error { color: red; font-size: 12px; }
    .user-item { padding: 12px; background: #f5f5f5; border-radius: 8px; margin: 8px 0; }
    .btn-small { width: auto; padding: 6px 12px; font-size: 12px; margin: 0 5px; }
    h2 { font-size: 16px; margin: 20px 0 10px; color: #333; }
    .password-container { position: relative; }
    .password-container input { padding-right: 40px; }
    .show-pwd-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #667eea; cursor: pointer; font-size: 18px; width: auto; padding: 0; margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div class="screen active" id="login">
      <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-size: 36px; margin-bottom: 10px;">📡 Roger</h1>
        <p style="color: #666;">Admin Login</p>
      </div>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@roger.app">
      <label>Password</label>
      <div class="password-container">
        <input type="password" id="loginPassword" placeholder="••••••••">
        <button class="show-pwd-btn" onclick="app.togglePassword('loginPassword')" type="button">👁️</button>
      </div>
      <button onclick="app.login()">Sign In</button>
      <p style="text-align: center; margin-top: 15px; font-size: 14px;">
        <span class="link" onclick="app.show('reset')">Reset Password</span>
      </p>
      <div id="loginError" class="error"></div>
    </div>

    <!-- Admin Panel -->
    <div class="screen" id="admin">
      <div class="header">
        <h1>📡 Admin Panel</h1>
        <button style="background: #ff4444; padding: 8px 12px; width: auto;" onclick="app.logout()">Logout</button>
      </div>

      <!-- Create New User -->
      <h2>Create New User</h2>
      <div>
        <label>Username</label>
        <input type="text" id="newUsername" placeholder="username">
        <label>Email</label>
        <input type="email" id="newEmail" placeholder="user@example.com">
        <label>Password</label>
        <input type="password" id="newPassword" placeholder="••••••••">
        <button onclick="app.createUser()">Create User</button>
        <div id="createError" class="error"></div>
      </div>

      <!-- All Users -->
      <h2 style="margin-top: 30px;">All Users</h2>
      <div id="usersList" style="border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px; max-height: 400px; overflow-y: auto;">
        <p style="color: #999;">Loading...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const app = {
      sbUrl: 'https://unasloczcdlaicdzqcpc.supabase.co',
      sbKey: 'sb_publishable_3UmS4S4YDI1E-1T8D4yJNg_1vFtiDFV',
      sb: null,
      user: null,

      init() {
        this.sb = window.supabase.createClient(this.sbUrl, this.sbKey);
        this.checkAuth();
      },

      show(screen) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screen).classList.add('active');
      },

      togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        if (field.type === 'password') {
          field.type = 'text';
        } else {
          field.type = 'password';
        }
      },

      async login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const err = document.getElementById('loginError');

        if (!email || !password) {
          err.textContent = 'Fill all fields';
          return;
        }

        try {
          const { data, error } = await this.sb.auth.signInWithPassword({ email, password });
          if (error) throw error;

          this.user = data.user;
          
          // Get user profile
          const { data: profile, error: profileError } = await this.sb
            .from('users')
            .select('*')
            .eq('id', this.user.id)
            .single();
          
          if (profileError) throw profileError;
          if (!profile) throw new Error('User profile not found');
          
          // Check if admin (handle both true boolean and string 'true')
          const isAdmin = profile.is_admin === true || profile.is_admin === 'true';
          
          if (!isAdmin) {
            throw new Error('Not an admin account');
          }

          this.user.username = profile.username;
          this.show('admin');
          this.loadAllUsers();
        } catch (e) {
          err.textContent = e.message;
          console.error('Login error:', e);
        }
      },

      async logout() {
        await this.sb.auth.signOut();
        this.user = null;
        this.show('login');
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
      },

      async createUser() {
        const username = document.getElementById('newUsername').value;
        const email = document.getElementById('newEmail').value;
        const password = document.getElementById('newPassword').value;
        const err = document.getElementById('createError');

        if (!username || !email || !password) {
          err.textContent = 'Fill all fields';
          return;
        }

        try {
          const { data, error } = await this.sb.auth.signUp({ email, password });
          if (error) throw error;

          await this.sb.from('users').insert({
            id: data.user.id,
            email,
            username,
            is_admin: false
          });

          err.textContent = '';
          alert('User created: ' + email);
          document.getElementById('newUsername').value = '';
          document.getElementById('newEmail').value = '';
          document.getElementById('newPassword').value = '';
          this.loadAllUsers();
        } catch (e) {
          err.textContent = e.message;
        }
      },

      async loadAllUsers() {
        try {
          const { data } = await this.sb.from('users').select('*').order('created_at', { ascending: false });

          const list = document.getElementById('usersList');
          if (!data || data.length === 0) {
            list.innerHTML = '<p style="color: #999;">No users found</p>';
            return;
          }

          list.innerHTML = data.map(u => `
            <div class="user-item">
              <div style="font-weight: 600;">${u.username}</div>
              <div style="font-size: 12px; color: #666;">${u.email}</div>
              <div style="font-size: 11px; color: #999;">Admin: ${u.is_admin ? 'Yes' : 'No'}</div>
              <div style="font-size: 10px; color: #bbb; margin-top: 5px;">ID: ${u.id.substring(0, 8)}...</div>
            </div>
          `).join('');
        } catch (e) {
          console.error(e);
        }
      },

      async checkAuth() {
        const { data } = await this.sb.auth.getSession();
        if (data.session) {
          this.user = data.session.user;
          const { data: profile } = await this.sb.from('users').select('*').eq('id', this.user.id).single();
          
          if (profile?.is_admin) {
            this.user.username = profile.username;
            this.show('admin');
            this.loadAllUsers();
          } else {
            this.show('login');
          }
        }
      }
    };

    app.init();
  </script>
</body>
</html>
