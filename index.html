<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roger - Push To Talk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 500px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
    .screen { display: none; padding: 30px; min-height: 600px; animation: fadeIn 0.3s ease-in; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
    .header h1 { font-size: 24px; color: #333; }
    .logout-btn { background: #ff4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
    input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #667eea; }
    button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button:hover { background: #5568d3; }
    .toggle-text { text-align: center; margin-top: 20px; color: #666; font-size: 14px; }
    .toggle-text a { color: #667eea; cursor: pointer; text-decoration: none; font-weight: 600; }
    .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #f5f5f5; border-radius: 12px; margin-bottom: 12px; cursor: pointer; }
    .friend-item:hover { background: #efefef; }
    .friend-avatar { width: 40px; height: 40px; border-radius: 50%; background: #667eea; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .message-list { max-height: 400px; overflow-y: auto; margin-bottom: 20px; border: 2px solid #e0e0e0; border-radius: 12px; padding: 15px; background: #fafafa; }
    .message-item { margin-bottom: 15px; padding: 12px; background: white; border-radius: 8px; border-left: 4px solid #667eea; }
    .message-item.sent { border-left-color: #4caf50; }
    .message-sender { font-weight: 600; color: #667eea; font-size: 12px; margin-bottom: 5px; }
    .ptt-button { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; font-size: 14px; font-weight: bold; cursor: pointer; margin: 20px auto; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
    .ptt-button.recording { background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 10px 30px rgba(255, 68, 68, 0.4); } 50% { box-shadow: 0 15px 50px rgba(255, 68, 68, 0.8); } }
    .status { text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; display: none; }
    .status.show { display: block; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .error { color: #cc0000; font-size: 12px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="screen active" id="loginScreen">
      <div style="text-align: center; margin-bottom: 40px;">
        <h1 style="font-size: 36px; color: #667eea; margin-bottom: 10px;">📡</h1>
        <h1>Roger</h1>
        <p style="color: #666; margin-top: 10px;">Push-to-Talk for close friends</p>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button onclick="handleLogin()">Sign In</button>
      <div class="toggle-text">Don't have an account? <a onclick="toggleScreen()">Sign Up</a></div>
      <div id="loginError" class="error"></div>
    </div>

    <div class="screen" id="signupScreen">
      <div style="text-align: center; margin-bottom: 40px;">
        <h1 style="font-size: 36px; color: #667eea; margin-bottom: 10px;">📡</h1>
        <h1>Roger</h1>
        <p style="color: #666; margin-top: 10px;">Create Account</p>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signupUsername" placeholder="your_username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••">
      </div>
      <button onclick="handleSignup()">Create Account</button>
      <div class="toggle-text">Already have an account? <a onclick="toggleScreen()">Sign In</a></div>
      <div id="signupError" class="error"></div>
    </div>

    <div class="screen" id="chatScreen">
      <div class="header">
        <h1>📡 Roger</h1>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </div>
      <div id="statusMessage" class="status"></div>
      <div style="margin-bottom: 30px;">
        <h2 style="font-size: 16px; margin-bottom: 15px; color: #333;">Friends</h2>
        <div id="friendsList" style="max-height: 150px; overflow-y: auto;"></div>
        <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #e0e0e0;">
          <h3 style="font-size: 14px; margin-bottom: 10px; color: #666;">Add Friend</h3>
          <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="email" id="friendEmail" placeholder="friend@example.com" style="flex: 1;">
            <button onclick="handleAddFriend()" style="width: auto; padding: 10px 20px; margin: 0;">Add</button>
          </div>
          <div id="friendError" class="error"></div>
        </div>
      </div>
      <div>
        <h2 style="font-size: 16px; margin-bottom: 10px; color: #333;">Messages</h2>
        <div class="message-list" id="messagesList">
          <p style="color: #999; text-align: center; padding: 20px;">No messages yet. Send one!</p>
        </div>
      </div>
      <div style="text-align: center; margin-top: 20px;">
        <p style="color: #666; font-size: 12px; margin-bottom: 10px;">Select a friend and press to talk</p>
        <button class="ptt-button" id="pttButton" onmousedown="startRecording()" onmouseup="stopRecording()">🎙️<br>PUSH TO TALK</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://unasloczcdlaicdzqcpc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3UmS4S4YDI1E-1T8D4yJNg_1vFtiDFV';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let selectedFriendId = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingStartTime = null;

    function toggleScreen() {
      document.getElementById('loginScreen').classList.toggle('active');
      document.getElementById('signupScreen').classList.toggle('active');
    }

    async function handleSignup() {
      const username = document.getElementById('signupUsername').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const errorEl = document.getElementById('signupError');

      if (!username || !email || !password) {
        errorEl.textContent = 'Please fill all fields';
        return;
      }

      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;

        await supabase.from('users').insert({ id: data.user.id, email, username });

        errorEl.textContent = '';
        alert('Account created! Please log in.');
        toggleScreen();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');

      if (!email || !password) {
        errorEl.textContent = 'Please fill all fields';
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        currentUser = data.user;
        const { data: profile } = await supabase.from('users').select('*').eq('id', currentUser.id).single();
        currentUser.username = profile.username;

        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('chatScreen').classList.add('active');
        loadFriends();
        subscribeToMessages();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      currentUser = null;
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('loginScreen').classList.add('active');
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
    }

    async function loadFriends() {
      try {
        const { data, error } = await supabase.from('friends').select('friend_id, users!friends_friend_id_fkey(id, username)').eq('user_id', currentUser.id);
        if (error) throw error;

        const friendsList = document.getElementById('friendsList');
        if (data.length === 0) {
          friendsList.innerHTML = '<p style="color: #999; font-size: 12px;">No friends yet. Add one below!</p>';
          return;
        }

        friendsList.innerHTML = data.map(item => `
          <div class="friend-item" onclick="selectFriend('${item.friend_id}', '${item.users.username}')">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="friend-avatar">${item.users.username[0].toUpperCase()}</div>
              <div style="font-weight: 500; color: #333;">${item.users.username}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading friends:', err);
      }
    }

    function selectFriend(friendId, username) {
      selectedFriendId = friendId;
      showStatus(`Selected: ${username}`, 'success');
    }

    async function handleAddFriend() {
      const email = document.getElementById('friendEmail').value;
      const errorEl = document.getElementById('friendError');
      errorEl.textContent = '';

      if (!email) {
        errorEl.textContent = 'Enter friend email';
        return;
      }

      try {
        const { data: friend, error: findError } = await supabase.from('users').select('id').eq('email', email).single();
        if (findError) throw new Error('Friend not found');

        await supabase.from('friends').insert({ user_id: currentUser.id, friend_id: friend.id });

        document.getElementById('friendEmail').value = '';
        loadFriends();
        showStatus('Friend added!', 'success');
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function loadMessages() {
      if (!selectedFriendId) return;

      try {
        const { data, error } = await supabase.from('messages').select('*, users!messages_sender_id_fkey(username)').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedFriendId}),and(sender_id.eq.${selectedFriendId},receiver_id.eq.${currentUser.id})`).order('created_at', { ascending: true });
        if (error) throw error;

        const messagesList = document.getElementById('messagesList');
        if (data.length === 0) {
          messagesList.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No messages yet. Send one!</p>';
          return;
        }

        messagesList.innerHTML = data.map(msg => `
          <div class="message-item ${msg.sender_id === currentUser.id ? 'sent' : ''}">
            <div class="message-sender" style="color: ${msg.sender_id === currentUser.id ? '#4caf50' : '#667eea'};">${msg.users.username}</div>
            <audio controls style="width: 100%; height: 36px;" src="${SUPABASE_URL}/storage/v1/object/public/audio/${msg.audio_url}"></audio>
            ${msg.duration ? `<div style="font-size: 11px; color: #999; margin-top: 5px;">${msg.duration}s</div>` : ''}
            <div style="font-size: 11px; color: #999; margin-top: 5px;">${new Date(msg.created_at).toLocaleTimeString()}</div>
          </div>
        `).join('');

        messagesList.scrollTop = messagesList.scrollHeight;
      } catch (err) {
        console.error('Error loading messages:', err);
      }
    }

    function subscribeToMessages() {
      supabase.channel('messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        if (selectedFriendId === payload.new.sender_id || selectedFriendId === payload.new.receiver_id) {
          loadMessages();
        }
      }).subscribe();
    }

    async function startRecording() {
      if (!selectedFriendId) {
        showStatus('Select a friend first!', 'error');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        recordingStartTime = Date.now();
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.start();

        const pttBtn = document.getElementById('pttButton');
        pttBtn.classList.add('recording');
        pttBtn.textContent = '🔴\nRECORDING';
      } catch (err) {
        showStatus('Microphone access denied', 'error');
      }
    }

    async function stopRecording() {
      if (!mediaRecorder) return;

      mediaRecorder.stop();
      mediaRecorder.onstop = async () => {
        const pttBtn = document.getElementById('pttButton');
        pttBtn.classList.remove('recording');
        pttBtn.textContent = '🎙️\nPUSH TO TALK';

        const duration = Math.round((Date.now() - recordingStartTime) / 1000);
        const blob = new Blob(audioChunks, { type: 'audio/webm' });

        try {
          showStatus('Uploading...', 'success');
          const fileName = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}.webm`;
          const { error: uploadError } = await supabase.storage.from('audio').upload(fileName, blob);
          if (uploadError) throw uploadError;

          await supabase.from('messages').insert({ sender_id: currentUser.id, receiver_id: selectedFriendId, audio_url: fileName, duration });

          showStatus('Message sent! ✓', 'success');
          loadMessages();
        } catch (err) {
          showStatus('Upload failed', 'error');
        }

        audioChunks = [];
      };
    }

    function showStatus(message, type) {
      const statusEl = document.getElementById('statusMessage');
      statusEl.textContent = message;
      statusEl.className = `status show ${type}`;
      setTimeout(() => statusEl.classList.remove('show'), 3000);
    }

    async function checkAuth() {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        currentUser = data.session.user;
        const { data: profile } = await supabase.from('users').select('*').eq('id', currentUser.id).single();
        currentUser.username = profile.username;
        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('chatScreen').classList.add('active');
        loadFriends();
        subscribeToMessages();
      }
    }

    checkAuth();
  </script>
</body>
</html>
